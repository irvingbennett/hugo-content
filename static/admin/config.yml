backend:
  name: github
  repo: irvingbennett/hugo-content # Replace with your GitHub repo
  branch: main
  base_url: https://alairelibre.net   # Your production domain
  auth_endpoint: /api/auth

media_folder: "static/wp-content/uploads/gallery_backup"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Body", name: "body", widget: "markdown"}